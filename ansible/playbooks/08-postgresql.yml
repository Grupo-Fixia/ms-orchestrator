- name: Desplegar PostgreSQL 16 (PoC, CDC habilitado)
  hosts: qa-k3s-01
  become: true
  tasks:
    - name: Renderizar manifiesto
      ansible.builtin.template:
        src: ../templates/postgresql.yaml.j2
        dest: /tmp/postgresql.yaml
        mode: "0600"

    - name: Aplicar
      ansible.builtin.command: k3s kubectl apply -f /tmp/postgresql.yaml
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"

    - name: Esperar a que el pod esté listo
      ansible.builtin.command: >
        k3s kubectl -n data wait --for=condition=Ready pod/postgres-0 --timeout=180s
      changed_when: false

    - name: Borrar manifiesto renderizado (contiene secretos)
      ansible.builtin.file:
        path: /tmp/postgresql.yaml
        state: absent