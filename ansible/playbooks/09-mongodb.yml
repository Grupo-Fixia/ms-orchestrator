- name: Desplegar MongoDB (PoC, sin replica set)
  hosts: qa-k3s-01
  become: true
  tasks:
    - name: Renderizar manifiesto
      ansible.builtin.template:
        src: ../templates/mongodb.yaml.j2
        dest: /tmp/mongodb.yaml
        mode: "0600"

    - name: Aplicar
      ansible.builtin.command: k3s kubectl apply -f /tmp/mongodb.yaml
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"

    - name: Esperar a que el pod esté listo
      ansible.builtin.command: >
        k3s kubectl -n data wait --for=condition=Ready pod/mongodb-0 --timeout=240s
      changed_when: false

    - name: Borrar manifiesto renderizado (contiene secretos)
      ansible.builtin.file:
        path: /tmp/mongodb.yaml
        state: absent