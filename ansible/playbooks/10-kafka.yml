- name: Desplegar Kafka (KRaft, 1 broker, solo interno)
  hosts: k3s_servers[0]
  become: true
  tasks:
    - name: Renderizar manifiesto
      ansible.builtin.template:
        src: ../templates/kafka.yaml.j2
        dest: /tmp/kafka.yaml
        mode: "0644"

    - name: Aplicar
      ansible.builtin.command: k3s kubectl apply -f /tmp/kafka.yaml
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"

    - name: Esperar a que el pod esté listo
      ansible.builtin.command: >
        k3s kubectl -n data wait --for=condition=Ready pod/kafka-0 --timeout=300s
      changed_when: false

    - name: Crear tópicos de eventos y de replicación de estado (GC-547) con cleanup.policy=compact
      ansible.builtin.shell: |
        for t in fixia.services.service-requests fixia.payments.events fixia.users.evaluations; do
          k3s kubectl -n data exec kafka-0 -- /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic "$t" --partitions 3 --replication-factor 1
        done
        k3s kubectl -n data exec kafka-0 -- /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic fixia.users.sessions --partitions 1 --replication-factor 1
        for t in fixia.users.technician-states fixia.users.company-states fixia.services.participations fixia.services.executor-workloads fixia.payments.held-services; do
          k3s kubectl -n data exec kafka-0 -- /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
          k3s kubectl -n data exec kafka-0 -- /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --entity-type topics --entity-name "$t" --alter --add-config cleanup.policy=compact
        done
      changed_when: false

    - name: Renderizar manifiesto de Kafka Exporter
      ansible.builtin.template:
        src: ../templates/kafka-exporter.yaml.j2
        dest: /tmp/kafka-exporter.yaml
        mode: "0644"

    - name: Garantizar que exista el namespace apps
      ansible.builtin.shell: k3s kubectl create namespace apps --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: false

    - name: Aplicar Kafka Exporter en namespace apps
      ansible.builtin.command: k3s kubectl apply -f /tmp/kafka-exporter.yaml
      register: apply_exporter
      changed_when: "'configured' in apply_exporter.stdout or 'created' in apply_exporter.stdout"

    - name: Esperar a que Kafka Exporter esté listo
      ansible.builtin.command: >
        k3s kubectl -n apps rollout status deployment/kafka-exporter --timeout=120s
      changed_when: false

    - name: Limpiar manifiesto temporal de exporter
      ansible.builtin.file:
        path: /tmp/kafka-exporter.yaml
        state: absent