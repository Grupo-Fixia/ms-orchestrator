- name: Desplegar RustFS (Almacenamiento S3 para Lakehouse y Evidencias)
  hosts: qa-k3s-01
  become: true
  tasks:
    - name: Renderizar manifiesto de RustFS
      ansible.builtin.template:
        src: ../templates/rustfs.yaml.j2
        dest: /tmp/rustfs.yaml
        mode: "0600"

    - name: Eliminar job rustfs-init previo si existe (para re-ejecución limpia)
      ansible.builtin.command: k3s kubectl -n data delete job rustfs-init --ignore-not-found=true
      changed_when: false

    - name: Aplicar manifiesto de RustFS
      ansible.builtin.command: k3s kubectl apply -f /tmp/rustfs.yaml
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"

    - name: Esperar a que el pod rustfs-0 esté listo
      ansible.builtin.command: >
        k3s kubectl -n data wait --for=condition=Ready pod/rustfs-0 --timeout=240s
      changed_when: false

    - name: Esperar a que el job rustfs-init cree los buckets
      ansible.builtin.command: >
        k3s kubectl -n data wait --for=condition=complete job/rustfs-init --timeout=180s
      changed_when: false

    - name: Borrar manifiesto renderizado (contiene credenciales)
      ansible.builtin.file:
        path: /tmp/rustfs.yaml
        state: absent

