- name: Preparar nodos (K3s y Observabilidad)
  hosts: all
  become: true
  tasks:
    - name: Paquetes base
      ansible.builtin.apt:
        name: [curl, ca-certificates, nfs-common, open-iscsi, jq, chrony, conntrack, ipset]
        state: present
        update_cache: true

    - name: Deshabilitar swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Quitar swap de fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Persistir módulos de kernel
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Cargar módulos de kernel
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Parámetros sysctl
      ansible.posix.sysctl:
        name: "{{ item.k }}"
        value: "{{ item.v }}"
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { k: net.ipv4.ip_forward, v: "1" }
        - { k: net.bridge.bridge-nf-call-iptables, v: "1" }
        - { k: net.bridge.bridge-nf-call-ip6tables, v: "1" }
        - { k: fs.inotify.max_user_watches, v: "524288" }
        - { k: fs.inotify.max_user_instances, v: "512" }

    - name: Deshabilitar servicios innecesarios
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        state: stopped
        enabled: false
      loop:
        - { name: cups, disable: "{{ disable_cups | default(true) | bool }}" }
        - { name: cups-browsed, disable: "{{ disable_cups | default(true) | bool }}" }
        - { name: avahi-daemon, disable: "{{ disable_avahi | default(true) | bool }}" }
        - { name: xrdp, disable: "{{ disable_xrdp | default(false) | bool }}" }
      when: item.disable | bool
      failed_when: false