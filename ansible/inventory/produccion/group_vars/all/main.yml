disable_cups: true
disable_avahi: true
disable_xrdp: false

env: "production"
cluster_name: "production"
k3s_primary_host: "prod-k3s-01"
k3s_secondary_hosts: "prod-k3s-02,prod-k3s-03"
obs_host: "prod-obs-01"

k3s_app_hosts:
  - "prod-k3s-01"
  - "prod-k3s-02"
k3s_data_hosts:
  - "prod-k3s-03"
taint_data_nodes: true
data_node_selector: "data"

k3s_cluster_cidr: 10.244.0.0/16
k3s_service_cidr: 10.245.0.0/16
k3s_data_dir: /var/lib/rancher/k3s
k3s_local_storage_path: /data/kubernetes
k3s_disable_traefik: true   # Desplegado con manifiesto plano
k3s_disable_servicelb: false
k3s_version: "v1.37.1+k3s1"
k3s_token: "{{ vault_k3s_token }}"
k3s_api_endpoint: 10.43.98.231
traefik_version: "v3.3"
traefik_replicas: 2
vault_version: "1.18"
postgres_version: "16"
mongo_version: "7.0"
kafka_version: "3.9.0"
kafka_node_selector: "data"
rustfs_image: "rustfs/rustfs:latest"
rustfs_rc_image: "rustfs/rc:latest"
rustfs_storage: "5Gi"
rustfs_bucket_lakehouse: "lakehouse"
rustfs_bucket_evidences: "evidences"
prometheus_version: "v2.53.1"
loki_version: "3.1.0"
promtail_version: "3.1.0"
grafana_version: "11.1.0"
prod_domain: "prod.local"
qa_domain: "prod.local"
prometheus_retention: "15d"   # TSDB local
loki_retention: "720h"        # 30 días de logs
prometheus_storage: "5Gi"
loki_storage: "10Gi"
grafana_storage: "2Gi"
grafana_admin_user: "admin"
